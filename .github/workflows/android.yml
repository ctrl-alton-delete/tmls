# tmls for Android: Rust tests on Linux, then the APK (plan M0).
name: android

on:
  push:
    branches: [android, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: client-core + core-ffi tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # client-core's tests/tmux_real.rs uses spikes/s2-core, whose libghostty-vt-sys needs
      # Zig 0.15.2 exactly (tooling/docker/README.md)
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-tests
      - run: cargo test --locked -p client-core -p core-ffi

  apk:
    name: APK (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ^4
      - uses: gradle/actions/setup-gradle@v5
      - name: Build, unit tests, lint
        working-directory: android
        # the runner's newest NDK; ANDROID_NDK_LATEST_HOME is a runner variable, not in ${{ env }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          ./gradlew --no-daemon assembleDebug testDebugUnitTest lint
      - name: Check the Rust library is in the APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk.txt | grep -E 'lib/(arm64-v8a|x86_64)/libcore_ffi.so'
          test "$(grep -cE 'lib/(arm64-v8a|x86_64)/libcore_ffi.so' /tmp/apk.txt)" = 2
      - uses: actions/upload-artifact@v5
        with:
          name: tmls-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
